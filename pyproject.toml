[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmm"
dynamic = ["version"]
description = "Transfer Matrix Models for modeling acoustic treatments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Rinaldi Polese Petrolli", email = "rinaldipp@gmail.com" },
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "mpmath",
    "xlsxwriter",
    "h5py",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/rinaldipp/tmm"
Repository = "https://github.com/rinaldipp/tmm"

[tool.setuptools.dynamic]
version = { attr = "tmm.__version__" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["tmm", "tmm.database", "tmm.database.*"]
namespaces = true

[tool.setuptools.package-data]
"tmm.database" = [
    "*.pdf",
    "_csv/*.csv",
    "_descr/*.txt",
]
